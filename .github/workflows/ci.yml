# AI ATLAS — uji, audit, build, terbitkan.
#
# Gerbang yang harus dilewati sebelum apa pun sampai ke pengguna:
#   1. Rust     — format, clippy tanpa peringatan, seluruh uji, dokumentasi.
#   2. Keamanan — audit kerentanan crate dan paket npm.
#   3. Web      — periksa tipe, uji, build, kebijakan keamanan konten, anggaran ukuran.
#   4. Terbit   — hanya bila ketiganya lolos, dan hanya dari `main`.
#
# .Deckyx

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Audit kerentanan mingguan, supaya cacat yang baru diumumkan tetap
    # ketahuan walau tidak ada perubahan kode.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust — format, lint, uji
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pasang toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Uji
        run: cargo test --workspace --verbose

      - name: Dokumentasi lengkap tanpa pranala rusak
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links
        run: cargo doc --workspace --no-deps

  security:
    name: Keamanan — audit dependensi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pasang toolchain Rust
        run: rustup toolchain install stable --profile minimal

      - name: Audit crate
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Audit paket npm
        # Seluruh paket npm di sini hanya dipakai saat pengembangan dan tidak
        # ikut terkirim ke pengguna, tetapi kerentanan berat tetap ditolak.
        run: npm audit --audit-level=high

  web:
    name: Web — tipe, uji, keamanan, anggaran
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pasang toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - name: Pasang wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Modul WebAssembly harus ada sebelum pemeriksaan tipe, karena
      # `web/src/engine.ts` mengimpor deklarasi tipe yang dihasilkan wasm-pack.
      - name: Bangun WebAssembly
        run: npm run wasm

      - name: Periksa tipe
        run: npm run typecheck

      - name: Uji TypeScript
        run: npm run test

      - name: Build produksi
        run: npm run build

      - name: Verifikasi hasil build
        run: node scripts/verify-dist.mjs

      - name: Anggaran ukuran
        run: npm run budget

      - name: Simpan hasil build
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Terbitkan ke GitHub Pages
    needs: [rust, security, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Terbitkan
        id: deployment
        uses: actions/deploy-pages@v4
