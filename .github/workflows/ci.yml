# AI ATLAS — uji, audit, build, terbitkan.
#
# Gerbang yang harus dilewati sebelum apa pun sampai ke pengguna:
#   1. Rust     — format, clippy tanpa peringatan, seluruh uji, dokumentasi.
#   2. Keamanan — audit kerentanan crate dan paket npm.
#   3. Web      — periksa tipe, uji, build, kebijakan keamanan konten, anggaran ukuran.
#   4. Konformansi — implementasi Rust diadu terhadap implementasi Go yang
#      ditulis terpisah, memakai 2.266 vektor uji berpola bit. Rumus yang salah
#      tetap konsisten dengan dirinya sendiri, sehingga uji terhadap satu
#      implementasi tidak bisa menangkapnya.
#   5. Oracle   — skema, PL/SQL, dan konformansi tiga arah Rust ⟷ Go ⟷ PL/SQL,
#      ditambah 60 uji unit atas penalaran yang datanya hidup di tabel.
#   6. Terbit   — hanya bila kelimanya lolos, dan hanya dari `main`.
#
# .Deckyx

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Audit kerentanan mingguan, supaya cacat yang baru diumumkan tetap
    # ketahuan walau tidak ada perubahan kode.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust — format, lint, uji
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pasang toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Uji
        run: cargo test --workspace --verbose

      - name: Dokumentasi lengkap tanpa pranala rusak
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links
        run: cargo doc --workspace --no-deps

  security:
    name: Keamanan — audit dependensi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pasang toolchain Rust
        run: rustup toolchain install stable --profile minimal

      - name: Audit crate
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Audit paket npm
        # Seluruh paket npm di sini hanya dipakai saat pengembangan dan tidak
        # ikut terkirim ke pengguna, tetapi kerentanan berat tetap ditolak.
        run: npm audit --audit-level=high

  web:
    name: Web — tipe, uji, keamanan, anggaran
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pasang toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - name: Pasang wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Modul WebAssembly harus ada sebelum pemeriksaan tipe, karena
      # `web/src/engine.ts` mengimpor deklarasi tipe yang dihasilkan wasm-pack.
      - name: Bangun WebAssembly
        run: npm run wasm

      - name: Periksa tipe
        run: npm run typecheck

      - name: Uji TypeScript
        run: npm run test

      - name: Build produksi
        run: npm run build

      - name: Verifikasi hasil build
        run: node scripts/verify-dist.mjs

      - name: Anggaran ukuran
        run: npm run budget

      - name: Simpan hasil build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  conform:
    name: Konformansi — Rust lawan Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pasang toolchain Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-conform-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-conform-${{ runner.os }}-

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          # Modul ini tidak punya dependensi, jadi tidak ada go.sum. Berkas
          # go.mod dipakai sebagai kunci singgahan supaya langkahnya tidak gagal
          # mencari berkas yang memang tidak seharusnya ada.
          cache-dependency-path: tools/conform/go.mod

      - name: Hasilkan vektor uji dari implementasi Rust
        run: cargo run -p ai-core --bin export_vectors

      # Vektor yang dihasilkan harus sama persis dengan yang tersimpan di
      # repositori. Kalau berbeda, berarti perilaku numerik Rust berubah tanpa
      # ada yang menyadarinya — dan perubahan seperti itu wajib disengaja.
      - name: Pastikan vektor tersimpan masih mutakhir
        run: |
          if ! git diff --quiet -- tools/conform/vectors; then
            echo "Vektor uji tersimpan sudah tidak sepadan dengan keluaran Rust."
            echo "Perilaku numerik berubah. Periksa selisih di bawah, lalu"
            echo "jalankan 'cargo run -p ai-core --bin export_vectors' dan komit hasilnya."
            git --no-pager diff --stat -- tools/conform/vectors
            exit 1
          fi

      - name: Format Go
        working-directory: tools/conform
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Berkas berikut belum diformat:"
            gofmt -l .
            exit 1
          fi

      - name: Vet Go
        working-directory: tools/conform
        run: go vet ./...

      - name: Uji harness
        working-directory: tools/conform
        run: go test ./... -v

      - name: Adu Rust lawan Go
        working-directory: tools/conform
        run: go run .

  oracle:
    name: Oracle — skema, PL/SQL, konformansi tiga arah
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: AiAtlasDev1
          APP_USER: aiatlas
          APP_USER_PASSWORD: AiAtlasDev1
        ports:
          - 1521:1521
        # Basis data butuh waktu untuk membuka diri. Tanpa health check,
        # langkah berikutnya menabrak listener yang belum siap dan gagal dengan
        # pesan yang tidak menyebut penyebab sebenarnya.
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 20s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5

      - name: Pasang toolchain Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-oracle-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-oracle-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hasilkan vektor uji dari implementasi Rust
        run: cargo run -p ai-core --bin export_vectors

      - name: Pasang Oracle Instant Client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip libaio1t64
          # Instant Client menautkan libaio.so.1; Ubuntu 24.04 memaketkannya
          # sebagai libaio.so.1t64 setelah peralihan time_t 64-bit.
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          curl -fsSLO https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          curl -fsSLO https://download.oracle.com/otn_software/linux/instantclient/instantclient-sqlplus-linuxx64.zip
          sudo mkdir -p /opt/oracle
          sudo unzip -q -o instantclient-basiclite-linuxx64.zip -d /opt/oracle
          sudo unzip -q -o instantclient-sqlplus-linuxx64.zip -d /opt/oracle
          IC=$(ls -d /opt/oracle/instantclient_*)
          echo "$IC" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$IC" >> "$GITHUB_ENV"

      # Konformansi PL/SQL menjalankan algoritma yang sama untuk ketiga
      # kalinya. Rumus yang salah tetap konsisten dengan dirinya sendiri; tiga
      # implementasi mandiri yang sepakat adalah bukti yang tidak bisa
      # diberikan uji terhadap satu implementasi mana pun.
      - name: Skema, PL/SQL, konformansi, uji unit
        env:
          AI_ATLAS_ORACLE_MODE: langsung
        run: bash oracle/run.sh

  deploy:
    name: Terbitkan ke GitHub Pages
    needs: [rust, security, web, conform, oracle]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Terbitkan
        id: deployment
        uses: actions/deploy-pages@v4
