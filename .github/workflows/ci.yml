# AI ATLAS — uji, build, terbitkan.
#
# Alur ini menegakkan tiga hal: seluruh uji Rust dan TypeScript lolos, gaya kode
# bersih tanpa peringatan, dan ukuran hasil build tidak melewati anggaran.
# Penerbitan ke GitHub Pages hanya berjalan bila ketiganya lolos.
#
# .Deckyx

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust — uji & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pasang toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Uji
        run: cargo test --workspace --verbose

  web:
    name: Web — tipe, uji, anggaran
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pasang toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - name: Pasang wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Modul WebAssembly harus ada sebelum pemeriksaan tipe, karena
      # `web/src/engine.ts` mengimpor deklarasi tipe yang dihasilkan wasm-pack.
      - name: Bangun WebAssembly
        run: npm run wasm

      - name: Periksa tipe
        run: npm run typecheck

      - name: Uji TypeScript
        run: npm run test

      - name: Build
        run: npm run build

      - name: Anggaran ukuran
        run: npm run budget

      - name: Simpan hasil build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Terbitkan ke GitHub Pages
    needs: [rust, web]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Terbitkan
        id: deployment
        uses: actions/deploy-pages@v4
