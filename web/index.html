    <script>
      // Tema dipulihkan sebelum gaya dilukis agar tidak ada kedipan warna.
      try {
        const t = localStorage.getItem("ai-atlas:theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
        } else {
          document.documentElement.dataset.theme = window.matchMedia(
            "(prefers-color-scheme: light)",
          ).matches
            ? "light"
            : "dark";
        }
        const l = localStorage.getItem("ai-atlas:lang");
        if (l === "id" || l === "en") document.documentElement.lang = l;
      } catch {
        /* Penyimpanan bisa diblokir; tema bawaan tetap terpakai. */
      }
    </script>
